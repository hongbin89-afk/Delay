  <title>DELAY — Now is already gone.</title>
  <style>

</main>
<video id="camera" autoplay muted playsinline aria-hidden="true" tabindex="-1"></video>
<script>
'use strict';
/* PHOTOGRAPHIC EXPOSURE ENGINE */
class ExposureBlend {
  static moments = {multi:{1:2,2:3,4:5,8:8},ghost:{1:5,2:7,4:9,8:11},strobe:{1:3,2:4,4:6,8:9}};
  constructor(output) {
    this.output=output;this.ctx=output.getContext('2d',{alpha:false});
    this.sample=document.createElement('canvas');
    this.sampleCtx=this.sample.getContext('2d',{alpha:false,willReadFrequently:true});
    // Decode/encode only at the boundaries. Float accumulation avoids 8-bit
    // rounding drift, especially across hundreds of LONG samples.
    this.linear=new Float32Array(256);this.encoded=new Uint8ClampedArray(65536);
    for(let i=0;i<256;i++){const v=i/255;this.linear[i]=v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}
    for(let i=0;i<65536;i++){const v=i/65535;this.encoded[i]=255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055);}
    this.clear();
  }
  drawFrame(source,ctx,mirror) {
    const vw=source.videoWidth||source.width,vh=source.videoHeight||source.height;
    if(!vw||!vh)throw new Error('CAMERA_FRAME_UNAVAILABLE');
    const w=this.output.width,h=this.output.height,aspect=w/h,sw=Math.min(vw,vh*aspect),sh=sw/aspect;
    ctx.save();ctx.setTransform(1,0,0,1,0,0);
    if(mirror){ctx.translate(w,0);ctx.scale(-1,1);}
    ctx.drawImage(source,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);ctx.restore();
  }
  preview(source,mirror=false) {this.drawFrame(source,this.ctx,mirror);}
  read(source,mirror) {
    this.drawFrame(source,this.sampleCtx,mirror);
    return this.sampleCtx.getImageData(0,0,this.output.width,this.output.height).data;
  }
  begin(source,mode,seconds,now,mirror=false) {
    if(!['multi','ghost','long','strobe'].includes(mode)||![1,2,4,8].includes(seconds))throw new Error('INVALID_EXPOSURE');
    this.clear();this.mode=mode;this.duration=seconds*1000;this.started=now;
    const w=this.output.width,h=this.output.height;
    this.sample.width=w;this.sample.height=h;
    this.mean=new Float32Array(w*h*3);this.image=this.ctx.createImageData(w,h);
    const pixels=this.read(source,mirror),lut=this.linear;
    for(let i=0,j=0;i<pixels.length;i+=4,j+=3){this.mean[j]=lut[pixels[i]];this.mean[j+1]=lut[pixels[i+1]];this.mean[j+2]=lut[pixels[i+2]];this.image.data[i+3]=255;}
    if(mode==='strobe'){
      // Fixed first-frame reference and one composite, not a video history.
      this.strobeBase=new Uint8ClampedArray(pixels);
      this.strobeComposite=new Uint8ClampedArray(pixels);
      this.strobeMarks=new Uint8Array(w*h);
    }
    this.weight=mode==='long'?0:1;this.samples=1;this.elapsed=0;this.nextSlot=1;this.active=true;
    this.interval=mode==='long'?0:this.duration/(ExposureBlend.moments[mode][seconds]-1);
    if(mode==='long'){
      // Keep just the previous frame for trapezoidal time integration, never
      // an expanding history. Frame-rate variations do not change exposure.
      this.previous=pixels;
      let brightness=0,n=0;
      for(let i=0;i<pixels.length;i+=128){brightness+=(pixels[i]*.2126+pixels[i+1]*.7152+pixels[i+2]*.0722)/255;n++;}
      this.night=Math.max(0,Math.min(1,(.43-brightness/n)/.30));
      if(this.night>0)this.lights=new Float32Array(w*h*4);
    }
    this.render();
  }
  update(source,now,mirror=false) {
    if(!this.active)return false;
    const elapsed=Math.min(this.duration,Math.max(0,now-this.started)),final=elapsed>=this.duration;
    if(elapsed<=this.elapsed)return false;
    if(this.mode!=='long' && !final && elapsed+.001<this.nextSlot*this.interval)return false;
    const pixels=this.read(source,mirror),lut=this.linear,mean=this.mean;
    if(this.mode==='strobe'){
      this.strobeSample(pixels);
    }else if(this.mode==='long'){
      const dt=(elapsed-this.elapsed)/1000,total=this.weight+dt,alpha=dt/total,prev=this.previous,lights=this.lights;
      for(let i=0,j=0;i<pixels.length;i+=4,j+=3){
        const r=lut[pixels[i]],g=lut[pixels[i+1]],b=lut[pixels[i+2]],pr=lut[prev[i]],pg=lut[prev[i+1]],pb=lut[prev[i+2]];
        mean[j]+=alpha*((r+pr)*.5-mean[j]);mean[j+1]+=alpha*((g+pg)*.5-mean[j+1]);mean[j+2]+=alpha*((b+pb)*.5-mean[j+2]);
        if(lights){
          // A separate, normalized, brightness-weighted full-frame average
          // lets lights linger at night. No motion tests, spatial masks,
          // cutouts, per-channel maxima, or additive highlight clipping.
          let a=Math.max(r,g,b),p=Math.max(pr,pg,pb);a*=a;a*=a;p*=p;p*=p;
          const scale=dt*.5;
          lights[i]+=(r*a+pr*p)*scale;lights[i+1]+=(g*a+pg*p)*scale;lights[i+2]+=(b*a+pb*p)*scale;lights[i+3]+=(a+p)*scale;
        }
      }
      this.previous=pixels;this.weight=total;
    }else{
      // Equal, separated exposures in MULTI, with a little more presence
      // for the final moment. GHOST decays *all* older weights together;
      // dividing by their sum keeps an unmoving photograph unchanged.
      if(this.mode==='ghost')this.weight*=Math.pow(.70,(elapsed-this.elapsed)/this.interval);
      const contribution=this.mode==='multi'&&final?1.25:1,alpha=contribution/(this.weight+contribution);
      for(let i=0,j=0;i<pixels.length;i+=4,j+=3){mean[j]+=alpha*(lut[pixels[i]]-mean[j]);mean[j+1]+=alpha*(lut[pixels[i+1]]-mean[j+1]);mean[j+2]+=alpha*(lut[pixels[i+2]]-mean[j+2]);}
      this.weight+=contribution;this.nextSlot=Math.floor((elapsed+.001)/this.interval)+1;
    }
    this.samples++;this.elapsed=elapsed;this.render();if(final)this.active=false;
    return true;
  }
  strobeSample(pixels) {
    // Unlike MULTI's full-frame averaging, STROBE composites separated
    // moving silhouettes over the first frame. Neighbourhood differences
    // suppress sensor noise, while soft edges avoid hard cut-out artifacts.
    const w=this.output.width,h=this.output.height,base=this.strobeBase,
      composite=this.strobeComposite,marks=this.strobeMarks;
    const cell=8,cols=Math.ceil(w/cell),rows=Math.ceil(h/cell);
    const mask=new Float32Array(cols*rows);
    for(let cy=0;cy<rows;cy++)for(let cx=0;cx<cols;cx++){
      let sum=0,count=0;
      for(let y=cy*cell;y<Math.min(h,(cy+1)*cell);y+=2)
        for(let x=cx*cell;x<Math.min(w,(cx+1)*cell);x+=2){
          const i=(y*w+x)*4;
          sum+=(Math.abs(pixels[i]-base[i])+Math.abs(pixels[i+1]-base[i+1])+Math.abs(pixels[i+2]-base[i+2]))/3;
          count++;
        }
      mask[cy*cols+cx]=Math.max(0,Math.min(1,(sum/count-13)/27));
    }
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const cx=Math.floor(x/cell),cy=Math.floor(y/cell);
      let strength=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const xx=Math.max(0,Math.min(cols-1,cx+dx)),yy=Math.max(0,Math.min(rows-1,cy+dy));
        strength+=mask[yy*cols+xx]*(dx===0&&dy===0?4:dx===0||dy===0?2:1);
      }
      strength/=16;
      if(strength<.06)continue;
      const p=y*w+x,i=p*4;
      // Earlier poses retain priority; later poses fill the remaining
      // space, keeping distinct bodies rather than translucent averages.
      const alpha=strength*(marks[p]?0.16:0.94);
      for(let k=0;k<3;k++)composite[i+k]=Math.round(composite[i+k]*(1-alpha)+pixels[i+k]*alpha);
      if(strength>.35)marks[p]=1;
    }
  }
  render() {
    if(this.mode==='strobe'){
      this.image.data.set(this.strobeComposite);
      this.ctx.putImageData(this.image,0,0);
      return;
    }
    const mean=this.mean,out=this.image.data,lut=this.encoded,lights=this.lights;
    for(let i=0,j=0;i<out.length;i+=4,j+=3){
      let r=mean[j],g=mean[j+1],b=mean[j+2];
      if(lights && lights[i+3]>1e-12){
        const inverse=1/lights[i+3],lr=lights[i]*inverse,lg=lights[i+1]*inverse,lb=lights[i+2]*inverse;
        let strength=Math.max(0,Math.min(1,(Math.max(lr,lg,lb)-.20)/.55));
        strength=strength*strength*(3-2*strength)*this.night*.68;
        r+=strength*(lr-r);g+=strength*(lg-g);b+=strength*(lb-b);
      }
      out[i]=lut[Math.max(0,Math.min(65535,Math.round(r*65535)))];out[i+1]=lut[Math.max(0,Math.min(65535,Math.round(g*65535)))];out[i+2]=lut[Math.max(0,Math.min(65535,Math.round(b*65535)))];
    }
    this.ctx.putImageData(this.image,0,0);
  }
  clear() {
    this.active=false;this.samples=0;this.weight=0;this.elapsed=0;this.night=0;
    this.mean=null;this.image=null;this.previous=null;this.lights=null;
    this.strobeBase=null;this.strobeComposite=null;this.strobeMarks=null;
    this.sample.width=1;this.sample.height=1;
  }
}
/* CAMERA APP */
(() => {
  const $=id=>document.getElementById(id),video=$('camera'),canvas=$('view');
  const engine=new ExposureBlend(canvas),captureCanvas=document.createElement('canvas');
  const captureCtx=captureCanvas.getContext('2d',{alpha:false});

  let requestId=0,captureId=0,raf=0,lastFrame=-Infinity,lastVideoTime=-1,lastFresh=0,cost=16,deadline=0;
  let imageFile=null,imageURL='',devices=[],interrupted=false;
  const say=message=>{$('hint').textContent=message;};
  function controls(){
    $('shutter').disabled=!ready||busy||frozen||exposing;
    $('shutter').classList.toggle('captured',frozen);$('tick').hidden=!frozen;
    $('flip').disabled=busy||exposing||saving||(!ready&&!frozen);$('flip').textContent=frozen?'RETAKE':'FLIP';
    $('flip').setAttribute('aria-label',frozen?'Retake the photograph':'Switch front or back camera');
    $('save').disabled=!frozen||!imageFile||saving;$('save').style.visibility=frozen?'visible':'hidden';
    $('modes').disabled=busy||exposing||frozen;$('durations').disabled=busy||exposing||frozen;$('colors').disabled=busy||exposing||frozen;
    canvas.classList.toggle('mono',colorMode==='mono');
    $('cameraLabel').textContent=facing==='user'?'FRONT · MIRRORED':'BACK CAMERA';
    $('memoryLabel').textContent=frozen?'ONE STILL PHOTO':mode.toUpperCase()+' · '+seconds+'S';
    $('exposure').hidden=!exposing;
    canvas.setAttribute('aria-label',frozen?'Your finished DELAY photograph':exposing?'Photograph accumulating across time':'Live camera preview');
  }
  function overlay(title,text,action){
    $('overlayTitle').textContent=title;$('overlayText').textContent=text;
    $('start').textContent=action||'OPEN CAMERA';$('start').hidden=!action;$('overlay').hidden=false;
  }
  function stopCamera(){
    cancelAnimationFrame(raf);raf=0;ready=false;exposing=false;
    if(stream)stream.getTracks().forEach(track=>track.stop());
    stream=null;video.pause();video.srcObject=null;engine.clear();
  }
  function waitForVideo(){
    if(video.readyState>=2 && video.videoWidth)return Promise.resolve();
    return new Promise((resolve,reject)=>{
      let timeout;const clean=()=>{clearTimeout(timeout);video.removeEventListener('loadeddata',check);video.removeEventListener('canplay',check);};
      const check=()=>{if(video.readyState>=2 && video.videoWidth){clean();resolve();}};
      video.addEventListener('loadeddata',check);video.addEventListener('canplay',check);
      timeout=setTimeout(()=>{clean();reject(new Error('VIDEO_TIMEOUT'));},10000);check();
    });
  }
  async function openStream(target,flip,previous){
    const settings={width:{ideal:1920},height:{ideal:1440},frameRate:{ideal:30,max:30}};
    try{return await navigator.mediaDevices.getUserMedia({audio:false,video:{...settings,facingMode:flip?{exact:target}:{ideal:target}}});}
    catch(error){
      if(!['OverconstrainedError','NotFoundError'].includes(error.name))throw error;
      if(flip){
        const list=await navigator.mediaDevices.enumerateDevices();
        const choices=list.filter(d=>d.kind==='videoinput'&&d.deviceId!==previous);
        const other=choices.find(d=>target==='user'?/front|user|facetime/i.test(d.label):/back|rear|environment/i.test(d.label))||choices[0];
        if(!other)throw new Error('ONE_CAMERA');
        return navigator.mediaDevices.getUserMedia({audio:false,video:{...settings,deviceId:{exact:other.deviceId}}});
      }
      return navigator.mediaDevices.getUserMedia({audio:false,video:true});
    }
  }
  async function startCamera(target=facing,flip=false){
    if(busy||frozen||exposing||document.hidden)return;
    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      overlay('A SECURE ADDRESS IS NEEDED.',location.protocol==='file:'?'On a laptop, open this file in Chrome. On iPhone, use the HTTPS version in Safari.':'Open DELAY through HTTPS or localhost to use your camera.',null);return;
    }
    const previous=stream?.getVideoTracks()[0]?.getSettings().deviceId,oldFacing=facing,ticket=++requestId;
    busy=true;paused=false;stopCamera();controls();
    overlay('OPENING CAMERA.','No photograph is made until you press the shutter.',null);
    try{
      let next,oneCamera=false;
      try{next=await openStream(target,flip,previous);}
      catch(error){
        if(flip && error.message==='ONE_CAMERA'){target=oldFacing;next=await openStream(target,false);oneCamera=true;}
        else throw error;
      }
      if(ticket!==requestId || document.hidden){next.getTracks().forEach(t=>t.stop());return;}
      stream=next;video.srcObject=next;
      const track=next.getVideoTracks()[0],actual=track.getSettings().facingMode;
      facing=actual==='user'||actual==='environment'?actual:target;
      track.addEventListener('ended',()=>{
        if(stream===next && !frozen){++requestId;busy=false;stopCamera();controls();overlay('CAMERA DISCONNECTED.','No photograph was saved. Reconnect the camera and try again.','TRY AGAIN');}
      },{once:true});
      await video.play();await waitForVideo();
      if(ticket!==requestId || document.hidden){if(stream===next)stopCamera();else next.getTracks().forEach(t=>t.stop());return;}
      try{devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');}catch{devices=[];}
      if(ticket!==requestId)return;
      lastFrame=-Infinity;lastVideoTime=-1;lastFresh=performance.now();cost=16;
      ready=true;$('overlay').hidden=true;
      say(interrupted?'EXPOSURE INTERRUPTED. READY TO TRY AGAIN.':oneCamera?'THIS DEVICE HAS ONE AVAILABLE CAMERA.':'HOLD STILL. LET TIME MOVE.');interrupted=false;
      engine.preview(video,facing==='user');raf=requestAnimationFrame(tick);
    }catch(error){
      if(ticket!==requestId)return;
      stopCamera();
      const messages={
        NotAllowedError:['CAMERA PERMISSION NEEDED.','Allow Camera for this page in Safari or Chrome, then try again.'],
        NotFoundError:['NO CAMERA FOUND.','Connect or enable a camera, then try again.'],
        NotReadableError:['CAMERA IS BUSY.','Close another app or tab using the camera, then try again.'],
        SecurityError:['CAMERA IS BLOCKED.','Open DELAY directly in Safari or Chrome and allow camera access.']
      };
      const [title,message]=messages[error.name]||['CAMERA NEEDS ANOTHER TRY.','Tap below to restart it. Close another app using your camera if needed.'];
      overlay(title,message,'TRY AGAIN');say('NO PHOTO HAS BEEN TAKEN.');
    }finally{if(ticket===requestId){busy=false;controls();}}
  }
  function failedExposure(){
    ++requestId;busy=false;frozen=false;clearPhoto();stopCamera();controls();
    overlay('EXPOSURE INTERRUPTED.','The camera paused. Nothing was saved. Try a fresh exposure.','RESTART CAMERA');say('NO PHOTO HAS BEEN SAVED.');
  }
  function tick(now){
    if(!ready||frozen||document.hidden)return;
    raf=requestAnimationFrame(tick);
    const fresh=video.currentTime!==lastVideoTime;
    if(fresh){lastVideoTime=video.currentTime;lastFresh=now;}
    try{
      if(exposing){
        $('countdown').textContent=(Math.ceil(Math.max(0,deadline-now)/100)/10).toFixed(1)+'s';
        if(now-lastFresh>750){failedExposure();return;}
        if(now>=deadline){engine.update(video,deadline,facing==='user');finish();return;}
      }
      // Prefer fresh camera frames; leave the countdown responsive even
      // between the intentionally separated MULTI/GHOST samples.
      const interval=exposing&&mode==='long'?Math.max(1000/30,Math.min(1000/15,cost*1.15)):1000/30;
      if(!fresh||now-lastFrame<interval-.5)return;
      lastFrame=now;const started=performance.now();
      const changed=exposing?engine.update(video,now,facing==='user'):(engine.preview(video,facing==='user'),true);
      if(changed)cost=cost*.85+(performance.now()-started)*.15;
    }catch{failedExposure();}
  }
  function clearPhoto(){
    ++captureId;imageFile=null;$('photo').hidden=true;$('photo').removeAttribute('src');
    if(imageURL)URL.revokeObjectURL(imageURL);imageURL='';captureCanvas.width=1;captureCanvas.height=1;
  }
  function capture(){
    if(!ready||busy||frozen||exposing)return;
    const now=performance.now();deadline=now+seconds*1000;lastFresh=now;lastVideoTime=video.currentTime;lastFrame=now;
    captureColor=colorMode;
    try{engine.begin(video,mode,seconds,now,facing==='user');}
    catch{failedExposure();return;}
    exposing=true;$('countdown').textContent=seconds.toFixed(1)+'s';controls();
    say('HOLD. ONE PHOTOGRAPH IS FORMING.');
  }
  function finish(){
    exposing=false;frozen=true;const ticket=++captureId;
    captureCanvas.width=canvas.width;captureCanvas.height=canvas.height;captureCtx.drawImage(canvas,0,0);
    // Convert only the finished composition; never alter exposure accumulation.
    if(captureColor==='mono'){
      const frame=captureCtx.getImageData(0,0,captureCanvas.width,captureCanvas.height),pixels=frame.data;
      for(let i=0;i<pixels.length;i+=4){const gray=Math.round(.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2]);pixels[i]=gray;pixels[i+1]=gray;pixels[i+2]=gray;}
      captureCtx.putImageData(frame,0,0);
    }
    stopCamera();controls();
    $('flash').classList.remove('fire');void $('flash').offsetWidth;$('flash').classList.add('fire');
    say('MULTIPLE MOMENTS. ONE PHOTOGRAPH.');
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15);
    captureCanvas.toBlob(blob=>{
      if(ticket!==captureId||!frozen)return;
      if(!blob){say('COULD NOT PREPARE PHOTO. PLEASE RETAKE.');return;}
      imageFile=new File([blob],`DELAY_${stamp}.jpg`,{type:'image/jpeg'});
      imageURL=URL.createObjectURL(blob);$('photo').src=imageURL;$('photo').hidden=false;controls();
    },'image/jpeg',.94);
  }
  async function save(){
    if(!frozen||!imageFile||saving)return;
    const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    if(isiOS && navigator.share && navigator.canShare?.({files:[imageFile]})){
      saving=true;controls();
      try{await navigator.share({files:[imageFile]});say('PHOTO READY. MAKE ANOTHER MOMENT.');}
      catch(error){say(error.name==='AbortError'?'YOUR PHOTO IS STILL HERE.':'PRESS AND HOLD THE PHOTO TO SAVE IT.');}
      finally{saving=false;controls();}
      return;
    }
    const a=document.createElement('a');a.href=imageURL;a.download=imageFile.name;document.body.appendChild(a);a.click();a.remove();
    say(isiOS?'PRESS AND HOLD THE PHOTO IF NEEDED.':'PHOTO DOWNLOADED.');
  }
  $('start').addEventListener('click',()=>startCamera());$('shutter').addEventListener('click',capture);$('save').addEventListener('click',save);
  $('flip').addEventListener('click',()=>{
    if(busy||exposing||saving)return;
    if(frozen){frozen=false;clearPhoto();controls();startCamera();return;}
    if(!ready)return;
    if(devices.length===1){say('THIS DEVICE HAS ONE AVAILABLE CAMERA.');return;}
    startCamera(facing==='user'?'environment':'user',true);
  });
  document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
    if(busy||exposing||frozen||mode===button.dataset.mode)return;
    mode=button.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    controls();say('HOLD STILL. LET TIME MOVE.');
  }));
  document.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{
    if(busy||exposing||frozen||colorMode===button.dataset.color)return;
    colorMode=button.dataset.color;
    document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    controls();
  }));
  document.querySelectorAll('[data-seconds]').forEach(button=>button.addEventListener('click',()=>{
    if(busy||exposing||frozen)return;
    seconds=Number(button.dataset.seconds);
    document.querySelectorAll('[data-seconds]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));controls();
  }));
  function suspend(){
    if(frozen)return;interrupted=interrupted||exposing;paused=true;++requestId;busy=false;stopCamera();controls();
    overlay('A MOMENT AWAY.','The camera is paused. Return to make a new photograph.','RESUME CAMERA');
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();else if(paused&&!frozen)startCamera();});
  window.addEventListener('pagehide',suspend);window.addEventListener('pageshow',e=>{if(e.persisted&&!frozen)startCamera();});
  async function offline(){
    if(!/^https?:$/.test(location.protocol)){$('offlineState').textContent='OFFLINE FILE';return;}
    const manifest=document.createElement('link');manifest.rel='manifest';manifest.href='./manifest.webmanifest';document.head.appendChild(manifest);
    const icon=document.createElement('link');icon.rel='apple-touch-icon';icon.href='./icon-192.png';document.head.appendChild(icon);
    if(!('serviceWorker' in navigator)||!window.isSecureContext){$('offlineState').textContent='HTTPS NEEDED FOR OFFLINE INSTALL';return;}
    $('offlineState').textContent='PREPARING OFFLINE';
    try{await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;$('offlineState').textContent='OFFLINE READY';}
    catch{$('offlineState').textContent='OFFLINE SETUP FAILED · REOPEN ONLINE';}
  }
  controls();offline();startCamera();
})();
</script>
</body>
</html>
